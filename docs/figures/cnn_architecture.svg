<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="755" viewBox="0 0 1500 755">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="55" font-family="Arial" font-size="34" font-weight="bold">CNN architecture for 32 by 32 inputs</text>
<rect x="70" y="100" width="1360" height="95" fill="#f3f4f5" stroke="#555" stroke-width="2"/>
<text x="100" y="144" font-family="Arial" font-size="28">Input  1 channel by 32 by 32  ink values in 0 to 1</text>
<path d="M 750 195 V 223" stroke="black" stroke-width="3"/><path d="M 750 231 l -9 -12 h 18 z"/>
<rect x="70" y="231" width="1360" height="95" fill="#f3f4f5" stroke="#555" stroke-width="2"/>
<text x="100" y="275" font-family="Arial" font-size="28">Convolution 3 by 3  16 channels  padding 1  ReLU</text>
<text x="100" y="309" font-family="Arial" font-size="28">Max pool 2 by 2  output 16 by 16 by 16</text>
<path d="M 750 326 V 354" stroke="black" stroke-width="3"/><path d="M 750 362 l -9 -12 h 18 z"/>
<rect x="70" y="362" width="1360" height="95" fill="#f3f4f5" stroke="#555" stroke-width="2"/>
<text x="100" y="406" font-family="Arial" font-size="28">Convolution 3 by 3  32 channels  padding 1  ReLU</text>
<text x="100" y="440" font-family="Arial" font-size="28">Max pool 2 by 2  output 32 by 8 by 8</text>
<path d="M 750 457 V 485" stroke="black" stroke-width="3"/><path d="M 750 493 l -9 -12 h 18 z"/>
<rect x="70" y="493" width="1360" height="95" fill="#f3f4f5" stroke="#555" stroke-width="2"/>
<text x="100" y="537" font-family="Arial" font-size="28">Flatten 2048 features</text>
<text x="100" y="571" font-family="Arial" font-size="28">Dense 128  ReLU  dropout probability 0.3 during training</text>
<path d="M 750 588 V 616" stroke="black" stroke-width="3"/><path d="M 750 624 l -9 -12 h 18 z"/>
<rect x="70" y="624" width="1360" height="95" fill="#f3f4f5" stroke="#555" stroke-width="2"/>
<text x="100" y="668" font-family="Arial" font-size="28">Dense 7  softmax</text>
<text x="100" y="702" font-family="Arial" font-size="28">Classes  0  4  7  8  A  D  H</text>
</svg>